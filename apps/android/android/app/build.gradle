apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'

// v0.6.0 #12: release signing and version metadata come from the
// environment, set by .github/workflows/release.yml after decoding a
// keystore that is never committed (decision G4). Falling back to the
// existing static defaults when these are absent keeps local
// `assembleDebug`/`assembleRelease` working unsigned.
def releaseKeystorePath = System.getenv('MCS_RELEASE_KEYSTORE_PATH')
def releaseVersionName = System.getenv('MCS_RELEASE_VERSION_NAME') ?: '1.0.0'
// v1.0.0 #5: versionCode must be monotonically increasing forever (Android
// refuses to let a user "upgrade" to a lower code) — fixed here once and
// documented so a future release does not have to re-derive the rule.
// Formula: major*10000 + minor*100 + patch (e.g. 1.0.0 -> 10000, 1.2.3 ->
// 10203), leaving 99 patch slots and 100 minor slots per major version
// before the ranges would collide.
def releaseVersionCode = (System.getenv('MCS_RELEASE_VERSION_CODE') ?: '10000') as Integer

android {
    namespace "studio.mihomoconfig.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "studio.mihomoconfig.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode releaseVersionCode
        versionName releaseVersionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        // v0.9.0 #9: `pm clear`/`am kill` targeting this app from *inside*
        // one of its own instrumented tests kills the instrumentation
        // process too — Android hosts test code in-process with the app
        // under test, always. `clearPackageData` lets the Orchestrator (a
        // separate process) do the clearing *between* tests instead, so no
        // test method ever has to call it on itself. Discovered the hard
        // way: `SafRoundTripTest`'s first `@Before`-issued `pm clear` call
        // reliably reported "Instrumentation run failed due to Process
        // crashed" on whichever test JUnit happened to run first, confirmed
        // via `adb logcat` showing `PACKAGE_DATA_CLEARED` and
        // `AndroidRuntime: VM exiting` for this exact package a few dozen
        // milliseconds after that test method started.
        testInstrumentationRunnerArguments clearPackageData: 'true'
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (releaseKeystorePath) {
            release {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv('MCS_RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('MCS_RELEASE_KEY_ALIAS')
                keyPassword System.getenv('MCS_RELEASE_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystorePath) {
                signingConfig signingConfigs.release
            }
        }
    }
    testOptions {
        // Pairs with `clearPackageData` above — the Orchestrator process
        // (not this app's own instrumentation) does the clearing.
        execution 'ANDROIDX_TEST_ORCHESTRATOR'
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    // v0.9.0 #9: the SAF picker (com.google.android.documentsui) is a
    // separate process this app's own window hierarchy can't reach —
    // Espresso only drives the process under test. UIAutomator operates on
    // the whole device's accessibility tree instead.
    androidTestImplementation "androidx.test.uiautomator:uiautomator:$androidxUiautomatorVersion"
    // `androidTestUtil`, not `androidTestImplementation`: the Orchestrator
    // installs and runs as its own separate APK/process, never linked into
    // the test APK — that separateness is the entire point (see the
    // `clearPackageData` comment on `testInstrumentationRunnerArguments`).
    androidTestUtil "androidx.test:orchestrator:$androidxOrchestratorVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
