<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Baseline CSP: no `unsafe-eval` (ADR-008 already guarantees the schema
      validator never needs it). v0.6.0 deliberately left this unchanged
      (decision Q2: no remote Bundle update source configured for Beta, so
      `connect-src 'self'` never needed loosening). Full hardening and a
      real deployment header are v0.9.0 work — this is still the scaffold's
      starting point.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <!-- ADR-029: registered from apps/web/src/pwa/register.ts, skipped on Android (Capacitor loads this same origin natively). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#cc785c" />
    <title>Mihomo Config Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
