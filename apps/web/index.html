<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Strict CSP (ADR-032, NFR-SEC-07): `default-src 'none'`, every other
      directive listed because something real in this build needs it — see
      the ADR for the per-directive justification and `tools/csp-check`
      (CI-enforced) for the machine check that this string, apps/web/public/_headers
      and the build output's own <script>/<link> tags never drift from it.
      `frame-ancestors` is deliberately absent here: every browser silently
      ignores it when delivered via `<meta>` (verified against a real build,
      2026-08-29 — Chrome logs exactly that), so a self-hoster's real HTTP
      response (apps/web/public/_headers / docs/self-hosting-headers.md) is
      the only place it can actually take effect.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none';"
    />
    <!-- ADR-029: registered from apps/web/src/pwa/register.ts, skipped on Android (Capacitor loads this same origin natively). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#cc785c" />
    <title>Mihomo Config Studio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
