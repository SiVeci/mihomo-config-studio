name: Release

# v0.6.0 #12 (decision G4, ADR-024 posture): builds the Web bundle + a signed
# Android APK and publishes both to a GitHub Release. Split into two jobs on
# purpose — `verify-and-build` never sees the signing secret, and
# `sign-and-release` never re-runs `check`/`test`/`build`, only consumes the
# artifact the first job already produced (ADR-010 §4: a signing step
# consumes an already-built, already-tested artifact, it doesn't rebuild).

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-run the release for (leave empty when triggered by a tag push)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: check, build Web, sync Android
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run test:coverage

      - name: Assert no VPN/broad-storage permissions in the manifest (source-level)
        run: node tools/android-manifest-check/dist/index.js apps/android/android/app/src

      - name: Build the manifest checker (needed standalone in the sign job, no pnpm there)
        run: pnpm --filter @mcs/android-manifest-check exec tsc -p tsconfig.json

      # v1.0.0 #11: without these, the production build ships with no
      # configured Stable update source (`resolveUpdateSources()` returns
      # `{}`, and "检查更新" shows "尚未配置更新源" forever) — #10 published
      # a real Stable Bundle Release (`schema-v0.9.1`) specifically so a real
      # build could point at it. The trust anchor override is left unset on
      # purpose: `packages/schema-registry/src/builtin.ts`'s own
      # `BUILTIN_TRUST_ANCHORS_HEX` already defaults to the same production
      # key (re-signed in #10), so there is nothing to override yet — this
      # env var exists for a *future* key rotation, not this release.
      - name: Build the Web bundle
        env:
          MCS_BUNDLE_UPDATE_SOURCES_JSON: '{"stable":{"manifestUrl":"https://github.com/SiVeci/mihomo-config-studio/releases/download/schema-v0.9.1/signed-manifest.json","fileBaseUrl":"https://github.com/SiVeci/mihomo-config-studio/releases/download/schema-v0.9.1"}}'
        run: pnpm run build

      - name: Sync the Web build into the Android shell
        run: pnpm --filter @mcs/android run build

      - name: Resolve release version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ inputs.tag }}" ]; then
            echo "version=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "Manual run needs a 'tag' input naming an existing tag." >&2
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-build
          retention-days: 7
          path: |
            apps/web/dist
            apps/android/android
            tools/android-manifest-check/dist
            docs/releases/v1.0.0-release-notes.md

  sign-and-release:
    name: sign APK, publish GitHub Release
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: android-release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-build

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # v1.0.0 #11: `versionCode` was `github.run_number` — an arbitrary,
      # ever-incrementing workflow-run counter, unrelated to the app version
      # and unrelated to the formula `build.gradle` itself documents
      # (`major*10000 + minor*100 + patch`, #5's own comment). Deriving it
      # from the real released version here is what that formula was for;
      # `versionName` also had the tag's leading "v" (`v1.0.0`) baked
      # straight into the Android-visible version string instead of the
      # conventional bare `1.0.0`.
      - name: Derive versionName/versionCode from the release version
        id: android-version
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-and-build.outputs.version }}"
          VERSION_NAME="${VERSION#v}"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NAME"
          VERSION_CODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore, build the signed APK, then wipe the keystore
        env:
          MCS_RELEASE_KEYSTORE_B64: ${{ secrets.MCS_RELEASE_KEYSTORE_B64 }}
          MCS_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.MCS_RELEASE_KEYSTORE_PASSWORD }}
          MCS_RELEASE_KEY_ALIAS: ${{ secrets.MCS_RELEASE_KEY_ALIAS }}
          MCS_RELEASE_KEY_PASSWORD: ${{ secrets.MCS_RELEASE_KEY_PASSWORD }}
          MCS_RELEASE_VERSION_NAME: ${{ steps.android-version.outputs.name }}
          MCS_RELEASE_VERSION_CODE: ${{ steps.android-version.outputs.code }}
        run: |
          set -euo pipefail
          chmod +x apps/android/android/gradlew
          KEYSTORE_PATH="$RUNNER_TEMP/mcs-release.keystore"
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$MCS_RELEASE_KEYSTORE_B64" | base64 --decode > "$KEYSTORE_PATH"
          export MCS_RELEASE_KEYSTORE_PATH="$KEYSTORE_PATH"
          (cd apps/android/android && ./gradlew assembleRelease)

      - name: Assert no VPN/broad-storage permissions in the built APK (product-level)
        run: |
          set -euo pipefail
          AAPT2="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)/aapt2"
          "$AAPT2" dump permissions apps/android/android/app/build/outputs/apk/release/app-release.apk > apk-permissions-dump.txt
          node tools/android-manifest-check/dist/index.js --apk-dump apk-permissions-dump.txt

      - name: Compute checksums
        id: checksums
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-and-build.outputs.version }}"
          WEB_ARCHIVE="mihomo-config-studio-web-${VERSION}.zip"
          (cd apps/web/dist && zip -qr "../../../$WEB_ARCHIVE" .)
          APK="apps/android/android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "mihomo-config-studio-${VERSION}.apk"
          sha256sum "$WEB_ARCHIVE" "mihomo-config-studio-${VERSION}.apk" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      # No `--prerelease`: v0.9.0 was genuinely a release candidate (hence
      # its own `--prerelease` flag), but v1.0.0 is the real first stable
      # release — marking it prerelease on GitHub would misrepresent it as
      # not production-ready, the opposite of what this release means.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ needs.verify-and-build.outputs.version }}"
          gh release create "$VERSION" \
            --repo "${{ github.repository }}" \
            --title "$VERSION" \
            --notes-file docs/releases/v1.0.0-release-notes.md \
            "mihomo-config-studio-web-${VERSION}.zip" \
            "mihomo-config-studio-${VERSION}.apk" \
            "SHA256SUMS.txt"
