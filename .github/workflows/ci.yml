name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose: pnpm/action-setup@v4 errors out
      # ("Multiple versions of pnpm specified") when the action input and
      # package.json's `packageManager` field both name a version. Verified
      # on this repo's first-ever real CI run (v0.9.0 #1) — all five jobs
      # failed here in 13s. `packageManager: pnpm@10.34.5` is the single
      # source of truth, and it pins an exact version rather than a range.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run test:coverage

  android-manifest-check:
    name: android manifest has no VPN/broad-storage permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # FR-AND-06 / NG-02 (PRD §13.5 release blocker): source-level scan only —
      # no Android SDK on this runner, so the aapt2-based produced-artifact
      # check (tools/android-manifest-check's --apk-dump mode, v0.6.0 #4)
      # runs in the release workflow instead, once an APK exists (#12).
      - name: Build checker
        run: pnpm --filter @mcs/android-manifest-check exec tsc -p tsconfig.json

      - name: Assert no VPN/broad-storage permissions or APIs in AndroidManifest.xml
        run: node tools/android-manifest-check/dist/index.js apps/android/android/app/src

  perf-baseline:
    name: import + scale benchmarks (record only, non-blocking)
    runs-on: ubuntu-latest
    # NFR-PERF-02/04: exit conditions are "< 2s" and the version document's
    # three perf numbers, verified per-slice in
    # docs/releases/plans/v0.2.0-perf-baseline.md /
    # docs/releases/plans/v0.4.0-perf-baseline.md — this job only keeps the
    # numbers visible on every push. A hard threshold job is v0.9.0 scope
    # (shared runners are too noisy to gate on before then).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the 1 MB corpus import benchmark
        run: pnpm vitest bench --run packages/validator/src/bench/import.bench.ts

      - name: Run the 1,000-entity / 10,000-rule scale benchmark
        run: pnpm vitest bench --run packages/validator/src/bench/scale.bench.ts

  no-network-egress:
    name: no configuration upload path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NFR-SEC-01 / release blocker: packages/** must contain no network call
      # outside a fixed, path-exact allowlist (v0.5.0 decision F4/F5), and the
      # allowlisted file must never send a request body. tools/egress-check
      # has its own unit tests (tools/egress-check/src/check.test.ts); this
      # step just runs it against the real tree.
      - name: Build egress checker
        run: pnpm --filter @mcs/egress-check exec tsc -p tsconfig.json

      - name: Reject network calls in packages/** outside the egress allowlist
        run: node tools/egress-check/dist/index.js packages

  core-config-test:
    name: built-in templates pass the real v1.19.29 kernel config test
    runs-on: ubuntu-latest
    # ADR-010 §4 posture: no secrets on a job that downloads and executes an
    # external binary, no third-party actions beyond the three already used
    # by every other job here, blocking (not continue-on-error) — PRD §13.5
    # lists a template failing the real kernel config test as a release
    # blocker.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (same composite project graph `pnpm run typecheck` uses)
        run: pnpm exec tsc -b tsconfig.build.json

      # PRD §13.3/§13.5: downloads the pinned, digest-verified v1.19.29
      # kernel (D-003 — upstream ships no checksum manifest, so this is
      # GitHub's own reported asset digest, fixed and never recomputed) and
      # runs every built-in template through a real `mihomo -t -f`. A
      # digest mismatch or a non-zero exit from any template fails the job.
      - name: Run built-in templates through the real Mihomo kernel
        run: node tools/core-test-runner/dist/index.js
