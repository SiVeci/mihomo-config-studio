name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run test:coverage

  android-manifest-check:
    name: android manifest has no VPN permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # FR-AND-06 / NG-02 (PRD §13.5 release blocker): source-level scan only —
      # no Android SDK on this runner, so the aapt2-based artifact check stays local (#13).
      - name: Build checker
        run: pnpm --filter @mcs/android-manifest-check exec tsc -p tsconfig.json

      - name: Assert no VPN permissions or APIs in AndroidManifest.xml
        run: node tools/android-manifest-check/dist/index.js apps/android/android/app/src

  perf-baseline:
    name: 1 MB import benchmark (record only, non-blocking)
    runs-on: ubuntu-latest
    # NFR-PERF-02: exit condition is "< 2s", verified per-slice in
    # docs/releases/plans/v0.2.0-perf-baseline.md — this job only keeps the
    # number visible on every push. A hard threshold job is v0.9.0 scope
    # (shared runners are too noisy to gate on before then).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the 1 MB corpus import benchmark
        run: pnpm vitest bench --run packages/validator/src/bench/import.bench.ts

  no-network-egress:
    name: no configuration upload path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # NFR-SEC-01 / release blocker: domain packages must contain no outbound
      # network calls. This is a coarse guard; it fails loudly if someone adds one.
      - name: Reject network calls in domain packages
        run: |
          if grep -rnE '\b(fetch|XMLHttpRequest|WebSocket|navigator\.sendBeacon)\s*\(' \
               --include='*.ts' --include='*.tsx' \
               packages/ 2>/dev/null | grep -v '\.test\.ts'; then
            echo "::error::Domain packages must not perform network I/O (NFR-SEC-01)."
            exit 1
          fi
          echo "No network egress found in packages/."

  core-config-test:
    name: built-in templates pass the real v1.19.29 kernel config test
    runs-on: ubuntu-latest
    # ADR-010 §4 posture: no secrets on a job that downloads and executes an
    # external binary, no third-party actions beyond the three already used
    # by every other job here, blocking (not continue-on-error) — PRD §13.5
    # lists a template failing the real kernel config test as a release
    # blocker.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (same composite project graph `pnpm run typecheck` uses)
        run: pnpm exec tsc -b tsconfig.build.json

      # PRD §13.3/§13.5: downloads the pinned, digest-verified v1.19.29
      # kernel (D-003 — upstream ships no checksum manifest, so this is
      # GitHub's own reported asset digest, fixed and never recomputed) and
      # runs every built-in template through a real `mihomo -t -f`. A
      # digest mismatch or a non-zero exit from any template fails the job.
      - name: Run built-in templates through the real Mihomo kernel
        run: node tools/core-test-runner/dist/index.js
