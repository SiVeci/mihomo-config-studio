name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck / lint / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No `version:` input on purpose: pnpm/action-setup@v4 errors out
      # ("Multiple versions of pnpm specified") when the action input and
      # package.json's `packageManager` field both name a version. Verified
      # on this repo's first-ever real CI run (v0.9.0 #1) — all five jobs
      # failed here in 13s. `packageManager: pnpm@10.34.5` is the single
      # source of truth, and it pins an exact version rather than a range.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format check
        run: pnpm run format:check

      - name: Unit tests with coverage
        run: pnpm run test:coverage

  android-manifest-check:
    name: android manifest has no VPN/broad-storage permissions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # FR-AND-06 / NG-02 (PRD §13.5 release blocker): source-level scan only —
      # no Android SDK on this runner, so the aapt2-based produced-artifact
      # check (tools/android-manifest-check's --apk-dump mode, v0.6.0 #4)
      # runs in the release workflow instead, once an APK exists (#12).
      - name: Build checker
        run: pnpm --filter @mcs/android-manifest-check exec tsc -p tsconfig.json

      - name: Assert no VPN/broad-storage permissions or APIs in AndroidManifest.xml
        run: node tools/android-manifest-check/dist/index.js apps/android/android/app/src

  perf-baseline:
    name: import + scale benchmarks (record only, non-blocking)
    runs-on: ubuntu-latest
    # NFR-PERF-02/04: exit conditions are "< 2s" and the version document's
    # three perf numbers, verified per-slice in
    # docs/releases/plans/v0.2.0-perf-baseline.md /
    # docs/releases/plans/v0.4.0-perf-baseline.md — this job only keeps the
    # numbers visible on every push. A hard threshold job is v0.9.0 scope
    # (shared runners are too noisy to gate on before then).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Run the 1 MB corpus import benchmark
        run: pnpm vitest bench --run packages/validator/src/bench/import.bench.ts

      - name: Run the 1,000-entity / 10,000-rule scale benchmark
        run: pnpm vitest bench --run packages/validator/src/bench/scale.bench.ts

  no-network-egress:
    name: no configuration upload path
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NFR-SEC-01 / release blocker: packages/** must contain no network call
      # outside a fixed, path-exact allowlist (v0.5.0 decision F4/F5), and the
      # allowlisted file must never send a request body. tools/egress-check
      # has its own unit tests (tools/egress-check/src/check.test.ts); this
      # step just runs it against the real tree.
      - name: Build egress checker
        run: pnpm --filter @mcs/egress-check exec tsc -p tsconfig.json

      - name: Reject network calls in packages/** outside the egress allowlist
        run: node tools/egress-check/dist/index.js packages

  log-redaction:
    name: no direct console.* call outside @mcs/logging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # NFR-SEC-03 / release blocker: every log line must route through
      # @mcs/logging's createLogger() so redact() can never be skipped.
      # tools/log-redaction-check has its own unit tests
      # (tools/log-redaction-check/src/check.test.ts); these two steps run it
      # against the real trees, same structure as no-network-egress above.
      - name: Build log-redaction checker
        run: pnpm --filter @mcs/log-redaction-check exec tsc -p tsconfig.json

      - name: Reject console.* calls in apps/web/src outside the allowlist
        run: node tools/log-redaction-check/dist/index.js apps/web/src

      - name: Reject console.* calls in packages/** outside the allowlist
        run: node tools/log-redaction-check/dist/index.js packages

  core-config-test:
    name: core-config-test (${{ matrix.track }})
    runs-on: ubuntu-latest
    # ADR-031: two tracks, two trust models. Stable pins a human-reviewed
    # digest (download.ts's KERNEL_DIGESTS, D-003) and blocks the pipeline on
    # any failure — PRD §13.5 lists a template/module-example/migration
    # failing the real kernel config test as a release blocker. Beta follows
    # upstream's own `latest` release and only learns its digest at run time
    # (a real, deliberate trust downgrade, recorded in ADR-031) —
    # `continue-on-error: true` so a Beta failure is visible but never blocks
    # anything, and its conclusion must never be used to justify releasing a
    # Stable Bundle (schema-release.yml checks the `(stable)` job by name,
    # never this matrix as a whole).
    continue-on-error: ${{ matrix.track == 'beta' }}
    strategy:
      fail-fast: false
      matrix:
        track: [stable, beta]
    # ADR-010 §4 posture: no secrets on a job that downloads and executes an
    # external binary, no third-party actions beyond the three already used
    # by every other job here.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build (same composite project graph `pnpm run typecheck` uses)
        run: pnpm exec tsc -b tsconfig.build.json

      # PRD §13.3/§13.5: stable downloads the pinned, digest-verified
      # v1.19.29 kernel (D-003 — upstream ships no checksum manifest, so this
      # is GitHub's own reported asset digest, fixed and never recomputed);
      # beta resolves and downloads whatever upstream currently tags
      # `latest`, verifying against the digest GitHub reports for that
      # specific asset at resolution time (ADR-031). Either way, every
      # template/module-example/migration case runs through a real
      # `mihomo -t -f`; any case not behaving as declared fails the job.
      - name: Run the kernel test matrix against the real Mihomo kernel
        run: node tools/core-test-runner/dist/index.js ${{ matrix.track == 'beta' && '--beta' || '' }}

  csp-check:
    name: strict CSP on the real build output
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build apps/web (this job checks the real bundle, never the source apps/web/index.html directly — ADR-032)
        run: pnpm run build

      - name: Build csp-check
        run: pnpm --filter @mcs/csp-check exec tsc -p tsconfig.json

      # NFR-SEC-07 / release blocker: strict CSP, no unsafe-eval, no
      # non-essential third-party script. tools/csp-check has its own unit
      # tests (tools/csp-check/src/check.test.ts); this step runs it against
      # the real build output.
      - name: Assert apps/web/dist carries the exact strict CSP (ADR-032)
        run: node tools/csp-check/dist/index.js apps/web/dist

  e2e-web:
    name: Web E2E (Playwright, real Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Chromium only (ADR-027's baseline is Chromium 107+ WebViews plus
      # desktop Chrome) — same reasoning `playwright.config.ts`'s `projects`
      # array already documents.
      - name: Install Playwright's Chromium
        run: pnpm exec playwright install --with-deps chromium

      # PRD §13.4 Web line, ADR-033: builds the real production bundle
      # (playwright.config.ts's own `webServer`) and drives it with a real
      # browser — jsdom cannot exercise the download/offline/Service-Worker
      # paths these scenarios need. Independent of the `check` job above by
      # design (ADR-033: a per-slice gate has to stay fast, or people start
      # skipping it).
      - name: Run Web E2E suite
        run: pnpm run e2e
