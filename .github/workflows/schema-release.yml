name: Schema Bundle Release

# ADR-010 §4 / ADR-024: only a version tag or an explicit manual dispatch can
# reach the signing job — never a plain push to any branch (tighter than
# ADR-010 §2's own "tag and main", per ADR-024's compensating measures).
# `pull_request_target` is never used anywhere in this file.
#
# v1.0.0 #10: `schema-v*`, not `v*` — `release.yml` (the Web/APK release)
# triggers on any `v*.*.*` tag, and a bare `v*` here would match every one of
# those too, firing both release pipelines off a single app-version tag like
# `v1.0.0`. A distinct prefix keeps the two release trains fully independent:
# a Schema Bundle version and the app version are different axes (see
# `packages/schema-registry/src/builtin.ts`'s own manifest-version comment)
# and were never meant to share a tag.
on:
  push:
    tags:
      - "schema-v*"
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (e.g. 0.9.1) — required for a manual run; ignored for a tag push, where the tag name (minus the leading "schema-v") is used instead.'
        required: false

permissions:
  contents: read

jobs:
  # "Schema 静态检查 → YAML Golden Test → Mihomo 内核兼容测试矩阵" (the release
  # pipeline's own documented order, v0.5.0-bundle-update-and-migration.md §3):
  # `pnpm run check` already runs schema-cli's own static-check unit tests and
  # the YAML Golden Test; `core-config-test`-equivalent below is the real
  # v1.19.29 kernel compatibility matrix (mirrors ci.yml's own job of the same
  # name — a separate workflow can't `needs:` a job in a different workflow
  # file, so this repeats the same steps rather than skipping them).
  test-matrix:
    name: static check / golden test / kernel compat matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Type check / lint / format / unit tests (incl. schema-cli static check, YAML Golden Test)
        run: pnpm run check && pnpm run format:check

      - name: Build (same composite project graph pnpm run typecheck uses)
        run: pnpm exec tsc -b tsconfig.build.json

      - name: Assert the real built-in modules directory itself passes schema-cli's static check
        run: pnpm vitest run tools/schema-cli/src/index.test.ts -t "accepts the real, shipping built-in modules directory"

      # Dry run of the actual pack step below (unsigned, thrown away here) —
      # this job has no way to gate `sign-and-release` on it directly (a
      # separate job can't fail this one after the fact), but it does mean a
      # regression in `ci-pack-builtin.test.ts` shows up in the un-gated
      # part of the pipeline rather than only inside the approval-gated job.
      - name: Smoke-test the Bundle pack step (dry run, no signing)
        env:
          CI_PACK_OUT_DIR: dry-run-pack
          CI_BUNDLE_ID: official
          CI_BUNDLE_VERSION: 0.0.0-dry-run
          CI_BUNDLE_CHANNEL: stable
          CI_FORMAT_VERSION: "1"
          CI_REQUIRES_APP: "0.1.0"
          CI_MIHOMO_MIN_VERSION: "1.19.29"
          CI_MIHOMO_MAX_TESTED_VERSION: "1.19.29"
          CI_MIHOMO_UPSTREAM_COMMIT: e26714a181ac0e2fa803453c0a8e9a9ce94e31cb
          CI_MIHOMO_DOCS_SNAPSHOT: "2026-08-19"
        run: pnpm run schema-release:pack

      - name: Built-in templates pass the real v1.19.29 kernel config test
        run: node tools/core-test-runner/dist/index.js

      # ADR-031's actual publish gate: "a Stable Bundle may only ship a
      # version that already passed the (stable) kernel test matrix" becomes
      # a real check here, not just a comment — this queries the check-run
      # GitHub already recorded for this exact commit (set by `ci.yml`'s own
      # `core-config-test (stable)` job when this commit was pushed to
      # `main`) rather than re-trusting this workflow's own inline re-run
      # above. Deliberately checks the `(stable)` job by its exact name, not
      # the Beta job and not "the matrix as a whole" — a Beta failure must
      # never block or appear to justify a Stable release (ADR-031).
      # `gh` is the runner's own preinstalled CLI, not a new third-party
      # action (ADR-010 §4's "zero new third-party actions" posture).
      - name: Verify this commit's core-config-test (stable) already succeeded on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CONCLUSION=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" \
            --jq '[.check_runs[] | select(.name == "core-config-test (stable)")] | sort_by(.started_at) | last | .conclusion // "none"')
          echo "core-config-test (stable) conclusion for ${{ github.sha }}: $CONCLUSION"
          if [ "$CONCLUSION" != "success" ]; then
            echo "::error::core-config-test (stable) has not succeeded for this commit on main (conclusion: $CONCLUSION). Refusing to publish a Stable Bundle for it." >&2
            exit 1
          fi

  build-unsigned:
    name: pack the built-in Bundle (unsigned — signing happens later, in the approval-gated job)
    needs: test-matrix
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc -b tsconfig.build.json

      - name: Resolve the Bundle version (tag name minus the leading "schema-v", or the manual dispatch input)
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#schema-v}"
          fi
          if [ -z "$VERSION" ]; then
            echo "No version resolved (manual dispatch needs the 'version' input)." >&2
            exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      # v1.0.0 #10: runs via `pnpm exec vitest`, not plain `node` — every
      # package this touches (`@mcs/schema-builtin`, `@mcs/schema-registry`)
      # is an ADR-007 source export, and plain `node` cannot resolve the
      # `.js`-suffixed relative imports inside those `.ts` files
      # (confirmed empirically: `node tools/schema-cli/dist/index.js <any
      # subcommand>` fails with `ERR_MODULE_NOT_FOUND` — this is what the
      # old `node .github/scripts/pack-unsigned.mjs` step here actually did,
      # via a spawned child process, and would have failed identically on
      # its first real run). See `tools/schema-cli/src/ci-pack-builtin.
      # test.ts`'s own doc comment for the full reasoning, including why it
      # reuses `@mcs/schema-builtin`'s already-assembled `BUILTIN_MODULE_
      # FILES` rather than re-deriving modules from the raw multi-file
      # source tree the way `pack --source` used to be pointed at here (that
      # tree is an *authoring* layout, not a packed-Bundle layout — pointing
      # `pack` at it directly hashed 96 scattered component files instead of
      # 10 assembled modules, which no real client could have loaded).
      #
      # ADR-010 §1 / ADR-024: this job has no access to the production key —
      # the manifest this step writes has an empty `signature`, replaced by
      # the real one in sign-and-release below.
      - name: Pack the built-in Bundle (static check + hash real content; signature left empty)
        env:
          CI_PACK_OUT_DIR: unsigned-bundle
          CI_BUNDLE_ID: official
          CI_BUNDLE_VERSION: ${{ steps.version.outputs.value }}
          CI_BUNDLE_CHANNEL: stable
          CI_FORMAT_VERSION: "1"
          CI_REQUIRES_APP: "0.1.0"
          CI_MIHOMO_MIN_VERSION: "1.19.29"
          CI_MIHOMO_MAX_TESTED_VERSION: "1.19.29"
          CI_MIHOMO_UPSTREAM_COMMIT: e26714a181ac0e2fa803453c0a8e9a9ce94e31cb
          CI_MIHOMO_DOCS_SNAPSHOT: "2026-08-19"
        run: pnpm run schema-release:pack

      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-bundle
          path: unsigned-bundle

  sign-and-release:
    name: sign with the production key and publish the GitHub Release
    needs: build-unsigned
    runs-on: ubuntu-latest
    # Environment gate (ADR-010 §2, narrowed by ADR-024): required reviewers
    # must approve before this job — the one holding `contents: write` and
    # the only one with access to SCHEMA_SIGNING_KEY_B64 — is allowed to run.
    environment: schema-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Explicit `path:` — without one, `download-artifact@v4` drops the
      # artifact's files straight into the checkout root (this repo's own
      # `package.json` and friends live there too), which would both make
      # the `unsigned-bundle/...` paths below wrong and let the release
      # step's `*.json` glob catch unrelated repo files.
      - uses: actions/download-artifact@v4
        with:
          name: unsigned-bundle
          path: unsigned-bundle

      # Version comes from package.json's `packageManager` — see the note on
      # the first pnpm/action-setup step in .github/workflows/ci.yml.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm exec tsc -b tsconfig.build.json

      # v1.0.0 #10: `pnpm exec vitest`, not plain `node` — same module-
      # resolution reasoning as the pack step above (`ci-sign-manifest.
      # test.ts`'s own doc comment has the full explanation). ADR-010 §4
      # still holds: the key is injected via `env:` (GitHub masks the exact
      # secret string wherever it is used) and read from `process.env`
      # inside the test file — it never appears on a command line.
      - name: Sign the manifest with the production key
        env:
          SCHEMA_SIGNING_KEY_B64: ${{ secrets.SCHEMA_SIGNING_KEY_B64 }}
          CI_SIGN_MANIFEST_IN: unsigned-bundle/unsigned-manifest.json
          CI_SIGN_MANIFEST_OUT: signed-manifest.json
        run: pnpm run schema-release:sign

      # Uploaded regardless of trigger — this is the "the approval-gated job
      # actually produced a signed artifact" evidence for a manual
      # workflow_dispatch verification run, without that run needing to also
      # publish a real, tag-less GitHub Release.
      - uses: actions/upload-artifact@v4
        with:
          name: signed-manifest
          path: signed-manifest.json

      # Every module file is its own release asset, not a zip — a GitHub
      # Release asset has no directory structure, and the client
      # (`updater.ts`'s `fetchBundle`) fetches each file individually as
      # `${fileBaseUrl}/${entry.path}`. `ci-pack-builtin.test.ts` already
      # wrote flat, slash-free filenames (`dns.json`, not `modules/dns.json`)
      # for exactly this reason — a zip's contents are not individually
      # addressable by URL, so archiving them would ship a Bundle no client
      # could actually update from.
      #
      # The unsigned manifest already did its job (it was read above, in the
      # sign step) — it must not also get uploaded as a release asset next
      # to the real, signed one.
      - name: Drop the now-superseded unsigned manifest before publishing
        if: github.event_name == 'push'
        run: rm unsigned-bundle/unsigned-manifest.json

      # Only a real tag push publishes a GitHub Release — a workflow_dispatch
      # run (used to verify the approval gate itself) must never create one.
      - name: Publish the GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create ${{ github.ref_name }}
          signed-manifest.json unsigned-bundle/*.json
          --title "Schema Bundle ${{ github.ref_name }}"
          --generate-notes
