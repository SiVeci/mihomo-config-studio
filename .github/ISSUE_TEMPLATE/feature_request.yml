name: 功能建议
description: 提出一个新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 想解决的问题
      description: 你现在遇到了什么困难，或者哪里觉得不方便？
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议的方案
      description: 你希望应用怎么做？如果有参考（其它工具、截图、示例配置），欢迎附上
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案（可选）

  - type: markdown
    attributes:
      value: |
        提醒：本项目**不运行 Mihomo 内核**、**不是代理/VPN 客户端**、**不提供云同步
        或账号体系**、**不通过项目服务器代抓订阅**——这些是项目定位本身的边界，不是
        暂时未实现的功能，相关建议大概率不会被采纳，详见 README 的"这是什么，不是
        什么"一节。

  - type: checkboxes
    id: no-sensitive-data
    attributes:
      label: 敏感信息确认
      options:
        - label: >-
            我确认本 Issue（包括任何配置片段或示例）不包含真实的订阅 URL、密码、
            UUID、证书或私钥
          required: true
