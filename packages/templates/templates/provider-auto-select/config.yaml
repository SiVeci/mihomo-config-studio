mode: rule
log-level: info
proxy-providers:
  my-subscription:
    type: http
    url: "https://your-subscription-url.example/CHANGE_ME" # CHANGE_ME: your real subscription link
    interval: 3600
    health-check:
      enable: true
      interval: 300
      url: https://cp.cloudflare.com/generate_204
proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - AUTO
    use:
      - my-subscription
  - name: AUTO
    type: url-test
    url: https://cp.cloudflare.com/generate_204
    interval: 300
    tolerance: 50
    use:
      - my-subscription
