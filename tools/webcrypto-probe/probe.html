<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>WebCrypto Ed25519 Probe</title>
    <style>
      body {
        font-family: monospace;
        font-size: 16px;
        padding: 16px;
        background: #111;
        color: #eee;
      }
      .ok {
        color: #4caf50;
      }
      .fail {
        color: #f44336;
      }
      pre {
        white-space: pre-wrap;
        word-break: break-all;
        background: #000;
        padding: 12px;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <h1>WebCrypto Ed25519 Probe (ADR-010 §待验证风险)</h1>
    <div id="summary">running&hellip;</div>
    <pre id="raw"></pre>
    <script>
      // RFC 8032 §7.1 TEST 1 vector. Fixed, not generated: a working
      // generateKey() does not imply verify() works, so this exercises
      // importKey()/verify() against a known-good signature directly.
      // Verified against Node's own Ed25519 implementation before use.
      const PUBLIC_KEY_RAW_HEX = 'd75a980182b10ab7d54bfed3c964073a0ee172f3daa62325af021a68f707511a';
      const SIGNATURE_HEX =
        'e5564300c360ac729086e2cc806e828a84877f1eb8e5d974d873e065224901' +
        '555fb8821590a33bacc61e39701cf9b46bd25bf5f0595bbe24655141438e7a100b';
      // Fixed 12-byte SPKI DER prefix for Ed25519:
      // SEQUENCE { SEQUENCE { OID 1.3.101.112 }, BIT STRING }.
      const SPKI_PREFIX_HEX = '302a300506032b6570032100';
      const SHA256_INPUT = 'abc';
      const SHA256_EXPECTED = 'ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad';

      function hexToBytes(hex) {
        const out = new Uint8Array(hex.length / 2);
        for (let i = 0; i < out.length; i += 1) out[i] = parseInt(hex.substr(i * 2, 2), 16);
        return out;
      }

      function bytesToHex(bytes) {
        return Array.from(bytes)
          .map((b) => b.toString(16).padStart(2, '0'))
          .join('');
      }

      function describeError(err) {
        const name = err && err.name ? err.name + ': ' : '';
        const message = err && err.message ? err.message : String(err);
        return name + message;
      }

      async function run() {
        const results = {
          userAgent: navigator.userAgent,
          isSecureContext: typeof isSecureContext !== 'undefined' ? isSecureContext : null,
          hasSubtle: typeof crypto !== 'undefined' && typeof crypto.subtle !== 'undefined',
        };

        if (!results.hasSubtle) {
          const reason = 'unavailable: crypto.subtle is undefined';
          results.importKeyRaw = reason;
          results.importKeySpki = reason;
          results.verify = reason;
          results.digestSha256 = reason;
          return results;
        }

        const rawKeyBytes = hexToBytes(PUBLIC_KEY_RAW_HEX);
        const spkiKeyBytes = new Uint8Array([...hexToBytes(SPKI_PREFIX_HEX), ...rawKeyBytes]);
        const sigBytes = hexToBytes(SIGNATURE_HEX);

        let rawKey = null;
        try {
          rawKey = await crypto.subtle.importKey('raw', rawKeyBytes, { name: 'Ed25519' }, true, [
            'verify',
          ]);
          results.importKeyRaw = 'ok';
        } catch (err) {
          results.importKeyRaw = 'failed: ' + describeError(err);
        }

        let spkiKey = null;
        try {
          spkiKey = await crypto.subtle.importKey('spki', spkiKeyBytes, { name: 'Ed25519' }, true, [
            'verify',
          ]);
          results.importKeySpki = 'ok';
        } catch (err) {
          results.importKeySpki = 'failed: ' + describeError(err);
        }

        const verifyKey = rawKey || spkiKey;
        if (verifyKey) {
          try {
            const ok = await crypto.subtle.verify(
              { name: 'Ed25519' },
              verifyKey,
              sigBytes,
              new Uint8Array(0),
            );
            results.verify = ok === true ? 'ok' : 'ran but returned false (should be true)';
          } catch (err) {
            results.verify = 'failed: ' + describeError(err);
          }
        } else {
          results.verify = 'skipped: no key import succeeded';
        }

        try {
          const digestBuf = await crypto.subtle.digest(
            'SHA-256',
            new TextEncoder().encode(SHA256_INPUT),
          );
          const digestHex = bytesToHex(new Uint8Array(digestBuf));
          results.digestSha256 =
            digestHex === SHA256_EXPECTED ? 'ok' : 'ran but hash mismatch: ' + digestHex;
        } catch (err) {
          results.digestSha256 = 'failed: ' + describeError(err);
        }

        return results;
      }

      function render(results) {
        const rows = [
          ['userAgent', results.userAgent],
          ['isSecureContext', String(results.isSecureContext)],
          ['hasSubtle', String(results.hasSubtle)],
          ["importKey('raw')", results.importKeyRaw],
          ["importKey('spki')", results.importKeySpki],
          ["verify('Ed25519')", results.verify],
          ["digest('SHA-256')", results.digestSha256],
        ];
        const summary = rows
          .map(([label, value]) => {
            const cls = /^ok$/.test(String(value))
              ? 'ok'
              : /^(false|failed|skipped)/i.test(String(value))
                ? 'fail'
                : '';
            return `<div><b>${label}:</b> <span class="${cls}">${value}</span></div>`;
          })
          .join('');
        document.getElementById('summary').innerHTML = summary;
        document.getElementById('raw').textContent = JSON.stringify(results, null, 2);
        document.title = 'PROBE_DONE ' + (results.verify === 'ok' ? 'PASS' : 'FAIL');
      }

      run()
        .then(render)
        .catch((err) => {
          document.getElementById('summary').textContent = 'PROBE THREW: ' + describeError(err);
          document.title = 'PROBE_DONE ERROR';
        });
    </script>
  </body>
</html>
